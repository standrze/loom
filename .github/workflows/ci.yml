name: Swift platform validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Install the requested swift.org toolchain independently of the runner's Xcode default.
      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Check toolchain
        run: |
          swift --version
          swift --version | python3 -c 'import re,sys; assert re.search(r"Swift version 6\.4\.1\b", sys.stdin.read()), "Swift 6.4.1 is required"'
      - name: Format, tests, and executable builds (sequential)
        run: |
          scripts/check-format.sh
          swift test
          swift build --product loom-demo
          swift build --product loom-browser
          swift build --product loom-widgets
          swift build --product loom-viewports
      - name: macOS PTY checks
        run: |
          python3 scripts/smoke.py .build/debug/loom-demo
          python3 scripts/smoke-browser.py .build/debug/loom-browser
          python3 scripts/smoke-widgets.py .build/debug/loom-widgets
          python3 scripts/smoke-viewports.py .build/debug/loom-viewports
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4.1-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        locale: [C, C.UTF-8]
    env:
      LANG: ${{ matrix.locale }}
      LC_ALL: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PTY test runtime
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Format, tests, and executable builds (sequential)
        run: |
          swift --version
          swift --version | python3 -c 'import re,sys; assert re.search(r"Swift version 6\.4\.1\b", sys.stdin.read()), "Swift 6.4.1 is required"'
          scripts/check-format.sh
          swift test
          swift build --product loom-demo
          swift build --product loom-browser
          swift build --product loom-widgets
          swift build --product loom-viewports
      - name: Linux PTY checks
        run: |
          python3 scripts/smoke.py .build/debug/loom-demo
          python3 scripts/smoke-browser.py .build/debug/loom-browser
          python3 scripts/smoke-widgets.py .build/debug/loom-widgets
          python3 scripts/smoke-viewports.py .build/debug/loom-viewports
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Check toolchain
        run: |
          $version = swift --version | Out-String
          Write-Output $version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'Swift version 6\.4\.1\b') { throw 'Swift 6.4.1 is required' }
      - name: Tests and executable builds (sequential)
        run: |
          swift test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($product in @('loom-demo', 'loom-browser', 'loom-widgets', 'loom-viewports')) {
            swift build --product $product
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
